name: Offline CPU contract and pilot tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --locked --python 3.13 --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
